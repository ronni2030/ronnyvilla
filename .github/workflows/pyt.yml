name: ronny-villa CI/CD

on: [push, pull_request]

jobs:
  # 1️⃣ Ejecutar pruebas con pytest
  test:
    name: ronny-villa - Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio ronny-villa
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Verificar archivo requirements.txt
        run: |
          echo "Contenido de requirements.txt:"
          cat requirements.txt

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          echo "Paquetes instalados:"
          pip list

      - name: Ejecutar pruebas unitarias
        run: pytest -v

  # 2️⃣ Construir imagen Docker y ejecutar los tests dentro del contenedor
  docker:
    name: ronny-villa - Docker Build & Test
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write  # Permiso para publicar packages

    steps:
      - name: Clonar repositorio ronny-villa
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen Docker ronny-villa
        run: docker build -t ronny-villa-calculadora .

      - name: Ejecutar tests dentro del contenedor ronny-villa
        run: docker run ronny-villa-calculadora pytest -v

      # 🆕 NUEVOS PASOS PARA PUBLICAR EN GITHUB PACKAGES
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetar imagen para GitHub Container Registry
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker tag ronny-villa-calculadora ghcr.io/${REPO_OWNER}/ronny-villa-calculadora:latest
          docker tag ronny-villa-calculadora ghcr.io/${REPO_OWNER}/ronny-villa-calculadora:${{ github.sha }}

      - name: Publicar imagen en GitHub Packages
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker push ghcr.io/${REPO_OWNER}/ronny-villa-calculadora:latest
          docker push ghcr.io/${REPO_OWNER}/ronny-villa-calculadora:${{ github.sha }}