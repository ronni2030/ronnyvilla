name: ronny-villa CI/CD

on: [push, pull_request]

jobs:
  # 1️⃣ Ejecutar pruebas con pytest
  test:
    name: ronny-villa - Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio ronny-villa
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar pytest
        run: pip install pytest

      - name: Ejecutar pruebas unitarias
        run: pytest -v  # ya no necesitamos especificar el archivo

  # 2️⃣ Construir imagen Docker y ejecutar los tests dentro del contenedor
  docker:
    name: ronny-villa - Docker Build & Test
    runs-on: ubuntu-latest
    needs: test  # Solo se ejecuta si las pruebas del paso anterior pasan correctamente

    steps:
      - name: Clonar repositorio ronny-villa
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen Docker ronny-villa
        run: docker build -t ronny-villa-calculadora .

      - name: Ejecutar tests dentro del contenedor ronny-villa
        run: docker run ronny-villa-calculadora
